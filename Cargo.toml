[package]
name = "qbit-distant-ui"
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["AnnoyedDev"]
description = "A small, good-looking desktop app to drive a remote (or Docker) qBittorrent through its WebUI API."

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
keyring = "4.2.0"
notify-rust = "4.19.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.2"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[profile.release]
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }

[target."cfg(windows)".dependencies]
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[build-dependencies]
winresource = "0.1.34"
